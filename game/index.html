<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sereia do Tesouro 🧜‍♀️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      min-height: 100%;
      background: #000510;
    }
    body {
      background: #000510;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      min-height: 100svh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game canvas {
      display: block;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
