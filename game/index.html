<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Block Rush</title>
  <meta name="description" content="Encaixe blocos, complete linhas e encontre sua próxima jogada no Block Rush. Experimente o puzzle em modo demo.">
  <meta name="theme-color" content="#090b1a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      min-height: 100%;
      background: #090b1a;
      overflow: hidden;
    }
    body {
      background: #090b1a;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      min-height: 100svh;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      touch-action: none;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: var(--app-height, 100dvh);
      min-height: 100svh;
      max-width: 100vw;
      max-height: var(--app-height, 100dvh);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: auto;
    }
  </style>
  <script>
    function syncAppViewport() {
      var viewport = window.visualViewport || window;
      var height = Math.max(
        viewport.height || 0,
        window.innerHeight || 0,
        document.documentElement.clientHeight || 0
      );
      var width = Math.max(
        viewport.width || 0,
        window.innerWidth || 0,
        document.documentElement.clientWidth || 0
      );
      document.documentElement.style.setProperty('--app-height', height + 'px');
      document.documentElement.style.setProperty('--app-width', width + 'px');
    }
    window.syncAppViewport = syncAppViewport;
    syncAppViewport();
    window.addEventListener('resize', syncAppViewport, { passive: true });
    window.addEventListener('orientationchange', function () {
      window.setTimeout(syncAppViewport, 120);
    }, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncAppViewport, { passive: true });
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
